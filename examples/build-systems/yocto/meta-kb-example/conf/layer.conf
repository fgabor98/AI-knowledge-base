# Example product layer for the Yocto and TI Processor SDK pages.
BBPATH .= ":${LAYERDIR}"
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "kb-example"
BBFILE_PATTERN_kb-example = "^${LAYERDIR}/"
BBFILE_PRIORITY_kb-example = "10"

LAYERDEPENDS_kb-example = "core"
LAYERSERIES_COMPAT_kb-example = "wrynose"
